<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check the current weather and conditions for any city.">
    <title>Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="weather-card">
        <form class="search-box" id="search-form" role="search">
            <label class="visually-hidden" for="search-input">City name</label>
            <input
                id="search-input"
                type="text"
                class="search-input"
                placeholder="Enter city name..."
                autocomplete="off"
                spellcheck="false"
            >
            <button type="submit" class="search-btn" aria-label="Search weather">
                <i class="fas fa-search" aria-hidden="true"></i>
            </button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>

        <div class="weather-info">
            <h1 class="city">—</h1>
            <p class="date"></p>

            <p class="temperature">
                <span class="temp-val">--</span><span class="temp-unit">°C</span>
            </p>

            <div class="description">
                <img class="icon" alt="" width="64" height="64">
                <p class="iconName">—</p>
            </div>

            <div class="details">
                <div class="col">
                    <i class="fas fa-water" aria-hidden="true"></i>
                    <div>
                        <p class="value humidity-val">--</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <i class="fas fa-wind" aria-hidden="true"></i>
                    <div>
                        <p class="value wind-val">--</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <noscript>
        <p class="noscript">This app needs JavaScript enabled to show the weather.</p>
    </noscript>

    <script src="config.js"></script>
    <script src="index.js"></script>
</body>
</html>
